[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinybev-reproduction"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3,<3",
    "numpy>=1.24,<2",
    "Pillow>=9",
    "scipy>=1.10,<2",
    "nuscenes-devkit==1.2.0",
    "motmetrics==1.4.0",
    "pandas>=1.5,<3",
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
include = ["tinybev*"]
